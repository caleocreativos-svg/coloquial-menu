<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16110d">
<title>Coloquial · Menú</title>
<meta name="description" content="Menú de Coloquial – Café de experiencia, Mariquita, Tolima.">
<link rel="icon" href="img/logo.png">
<link rel="preload" as="image" href="img/vinilo/portada.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: la carta impresa de Coloquial, tal cual, pensada para leer con el pulgar.
   IDEA: el tríptico desplegado en una sola tira vertical, panel tras panel.
   PICTURE: los paneles originales del vinilo, a todo el ancho del celular.
   COLOUR and TYPE: negro café #16110d con dorado #e5b443, como la carta; Montserrat para la navegación.
   LAYOUT: barra fija con logo y secciones; paneles apilados; visor para ampliar; pie con enlaces. */
:root{color-scheme:dark;--bg:#16110d;--gold:#e5b443;--cream:#f4ead6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--cream);font:15px/1.4 Montserrat,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:640px;margin:0 auto}
.bar{position:sticky;top:0;z-index:10;background:#16110df0;backdrop-filter:blur(10px);border-bottom:1px solid #e5b44333;padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.brow{display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.brow img{height:38px}
.brow a{font-size:12px;font-weight:600;color:var(--gold);text-decoration:none;border:1px solid #e5b44388;border-radius:999px;padding:7px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 14px 0;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid #f4ead633;font-size:12.5px;font-weight:600;color:#f4ead6cc;white-space:nowrap;scroll-snap-align:center;transition:background .3s,color .3s,border-color .3s}
.chip.on{background:var(--gold);color:#16110d;border-color:var(--gold)}
.panels{display:grid;gap:10px;padding:10px 0 0}
.pn{position:relative;display:block;width:100%;opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.pn.in{opacity:1;transform:none}
.pn img{display:block;width:100%;height:auto;background:#221a14}
.zoom{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:#16110dcc;color:var(--gold);font-size:12px;font-weight:600;border:1px solid #e5b44366;backdrop-filter:blur(4px)}
.zoom svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.end{padding:26px 18px calc(30px + env(safe-area-inset-bottom));text-align:center}
.end a{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--gold);color:#16110d;font-weight:700;text-decoration:none;margin-bottom:10px}
.end a.ghost{background:none;color:var(--gold);border:1px solid #e5b44388}
.end p{font-size:11.5px;color:#f4ead699;margin:14px 0 0}
.viewer{position:fixed;inset:0;z-index:30;background:#0d0a08;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.viewer.open{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.viewer img{display:block;width:200%;max-width:none;height:auto;transition:width .25s}
.viewer.fit img{width:100%}
.vctl{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:31;display:none;gap:8px}
.viewer.open+.vctl{display:flex}
.vctl button{width:44px;height:44px;border-radius:50%;background:#16110de6;color:var(--gold);border:1px solid #e5b44388;font-size:22px;font-weight:600;display:grid;place-items:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pn{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brow"><img src="img/logo-claro.png" alt="Coloquial · Café de experiencia"><a href="enlaces/">WiFi y redes</a></div>
    <nav class="chips" id="chips" aria-label="Secciones del menú"></nav>
  </header>
  <main class="panels" id="panels"></main>
  <footer class="end">
    <a href="enlaces/">WiFi, pagos y redes</a>
    <a class="ghost" href="interactivo/">Ver menú con fotos</a>
    <p>Kr 2A n° 6-90, Mariquita, Tolima · 312 316 4982 · @coloquialcoffee<br>Precios en pesos colombianos.</p>
  </footer>
</div>
<div class="viewer fit" id="viewer" role="dialog" aria-modal="true" aria-label="Panel ampliado"><img id="vimg" alt=""></div>
<div class="vctl"><button id="vz" aria-label="Acercar o alejar">+</button><button id="vx" aria-label="Cerrar">×</button></div>

<script>
{
const $=s=>document.querySelector(s);
const P=[
  ['portada','Portada','Coloquial, café de experiencia'],
  ['p1','Filtrados · Desayunos · Brunch','Filtrados, desayunos y brunch'],
  ['p2','Bebidas calientes · Frías · Sodas','Bebidas calientes, frías, sodas y limonadas'],
  ['p3','Malteadas · Aromáticas · Jugos','Malteadas, aromáticas, aguapanelas y jugos naturales'],
  ['p4','Postres · Hojaldres','Postres y hojaldres artesanales'],
  ['p5','Bebidas adicionales · Adicionales','Bebidas adicionales y adicionales']
];
$('#chips').innerHTML=P.map(([id,l],i)=>`<button class="chip${i?'':' on'}" data-to="${id}">${l}</button>`).join('');
$('#panels').innerHTML=P.map(([id,,alt],i)=>`<button class="pn" id="${id}" data-img="img/vinilo/${id}.jpg" aria-label="Ampliar: ${alt}"><img src="img/vinilo/${id}.jpg" alt="Menú Coloquial: ${alt}" width="1240" height="${[2938,2999,3077,2942,2993,3090][i]}"${i>1?' loading="lazy"':''}><span class="zoom"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5M11 8v6M8 11h6"/></svg>Ampliar</span></button>`).join('');

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{rootMargin:'0px 0px -5% 0px'});
document.querySelectorAll('.pn').forEach(p=>io.observe(p));
let lock=0;
const setChip=id=>document.querySelectorAll('.chip').forEach(c=>{const on=c.dataset.to===id;c.classList.toggle('on',on);if(on){const p=c.parentElement;p.scrollTo({left:c.offsetLeft-p.clientWidth/2+c.clientWidth/2,behavior:'smooth'});}});
const spy=new IntersectionObserver(es=>{if(Date.now()<lock)return;es.forEach(e=>{if(e.isIntersecting)setChip(e.target.id);});},{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('.pn').forEach(p=>spy.observe(p));
$('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;lock=Date.now()+900;setChip(c.dataset.to);document.getElementById(c.dataset.to).scrollIntoView({behavior:'smooth',block:'start'});});

const V=$('#viewer');
const open=src=>{$('#vimg').src=src;V.classList.add('open');V.classList.remove('fit');$('#vz').textContent='−';document.body.style.overflow='hidden';V.scrollTo(0,0);};
const close=()=>{V.classList.remove('open');document.body.style.overflow='';};
$('#panels').addEventListener('click',e=>{const p=e.target.closest('.pn');if(p)open(p.dataset.img);});
$('#vz').addEventListener('click',()=>{const fit=V.classList.toggle('fit');$('#vz').textContent=fit?'+':'−';V.scrollTo(0,0);});
$('#vx').addEventListener('click',close);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
}
</script>
</body>
</html>
