<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1c14">
<title>Coloquial · Enlaces</title>
<meta name="description" content="Coloquial – Café de experiencia, Mariquita, Tolima. Menú, WiFi, pagos y redes.">
<link rel="icon" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
/* VOICE: cálido y directo; la tarjeta de bienvenida que el cliente abre al sentarse.
   IDEA: la misma app de Coloquial en versión "un toque": cabecera espresso, papel crema, tarjetas blancas.
   PICTURE: logo con la taza de vapor y botones grandes con íconos dorados.
   COLOUR and TYPE: crema #f6efe4, espresso #2a1c14, dorado #c9973a; Montserrat + Playfair itálica.
   LAYOUT: una columna de 480px: logo, menú destacado, WiFi, pagos, redes, ubicación. */
:root{color-scheme:light;--bg:#f6efe4;--ink:#2a1c14;--ink2:#6e5a4a;--line:#eadfcd;--gold:#c9973a;--gold2:#a87a24;--goldbg:linear-gradient(135deg,#dcae52,#b8862b);--esp:#2a1c14;--sh:0 6px 18px #5a3c1f14}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#e9dfcf;color:var(--ink);font:15px/1.45 Montserrat,system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;min-height:100dvh;margin:0 auto;background:var(--bg);box-shadow:0 0 60px #5a3c1f33;padding-bottom:30px}
.hero{position:relative;color:#f6efe4;text-align:center;padding:calc(30px + env(safe-area-inset-top)) 20px 34px;background:radial-gradient(120% 80% at 80% 0,#5a3d2a 0,#2a1c14 60%);border-radius:0 0 30px 30px}
.hero img{width:min(240px,66%);display:block;margin:0 auto 6px;animation:fade 1s ease}
.hero p{margin:4px 0 0;opacity:.85;font-size:14px}
.hero em{font-family:"Playfair Display",serif;color:#f6d79a;font-size:20px;display:block;margin-top:8px}
@keyframes fade{from{opacity:0;transform:translateY(-8px)}}
.wrap{padding:0 18px;display:grid;gap:12px;margin-top:-18px;position:relative}
.up{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.menu{position:relative;display:block;height:150px;border-radius:22px;overflow:hidden;color:#fff;text-decoration:none;box-shadow:0 12px 28px #2a1c1433}
.menu img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 10s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.1)}}
.menu:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#2a1c14ee 20%,#2a1c1400 80%)}
.menu>span:not(.go){position:absolute;left:20px;top:50%;transform:translateY(-50%);z-index:1}
.menu b{display:block;font-size:22px}
.menu small{color:#f6d79a;font-size:13px}
.menu .go{position:absolute;right:16px;bottom:16px;z-index:1;width:42px;height:42px;border-radius:50%;background:var(--goldbg);display:grid;place-items:center}
.card{background:#fff;border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;text-decoration:none;color:var(--ink);min-height:68px}
.row .ci{width:44px;height:44px;border-radius:14px;background:var(--bg);color:var(--gold2);display:grid;place-items:center;flex:none;transition:background .25s,color .25s}
.row:hover .ci{background:var(--esp);color:var(--gold)}
.row .tx{flex:1}
.row b{display:block;font-size:15px}
.row small{color:var(--ink2);font-size:12.5px}
.row .chev{color:var(--ink2);transition:transform .3s}
.open .row .chev{transform:rotate(90deg)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}
.in{padding:0 16px 16px;display:grid;gap:10px}
.kv{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px}
.kv div{flex:1}
.kv small{display:block;font-size:11.5px;color:var(--ink2)}
.kv code{font:700 16px Montserrat,sans-serif;letter-spacing:.02em;word-break:break-all}
.copy{flex:none;height:38px;padding:0 14px;border-radius:999px;background:var(--goldbg);color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.copy .ico{width:16px;height:16px}
.copy.ok{background:#3f8a4a}
.qr{display:flex;gap:12px;align-items:center;font-size:12.5px;color:var(--ink2)}
.qr canvas,.qr img{width:110px;height:110px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:6px;flex:none}
.h{font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin:10px 4px -2px}
.soc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.soc a{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;transition:transform .2s}
.soc a:active{transform:scale(.95)}
.soc .ci{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.foot{text-align:center;font-size:11.5px;color:var(--ink2);margin:20px 18px 0}
.foot a{color:var(--gold2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--esp);color:#f6efe4;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 10h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c-.8 1 .8 2 0 3M11.5 3c-.8 1 .8 2 0 3"/></symbol>
 <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></symbol>
 <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7h15a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12v3"/><path d="M16 13.5h2"/></symbol>
 <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
 <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
 <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
 <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".8"/></symbol>
 <symbol id="i-wa" viewBox="0 0 24 24"><path d="M4 20l1.5-4.5a8.5 8.5 0 1 1 3 3z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-2-2-1-1 1c-1.5-.5-2.5-1.5-3-3l1-1-1-2z"/></symbol>
 <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s-7-7-7-12a7 7 0 0 1 14 0c0 5-7 12-7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
 <symbol id="i-tt" viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.5 3 2.5 5 5.5 5"/></symbol>
 <symbol id="i-fb" viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></symbol>
 <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.8z"/></symbol>
</svg>

<div class="app">
  <header class="hero">
    <img src="../img/logo-claro.png" alt="Coloquial · Café de experiencia">
    <p>Mariquita, Tolima</p>
    <em>Bienvenido a la experiencia</em>
  </header>
  <main class="wrap" id="wrap"></main>
  <p class="foot">Kr 2A n° 6-90, Mariquita, Tolima<br>Hecho por <a href="https://instagram.com/caleocreativos" target="_blank" rel="noopener">Caleo Creativos</a></p>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
{
/* ====== DATOS DE COLOQUIAL: edita aquí ======
   Si un dato está vacío, esa sección no se muestra. */
const WIFI = { red: '', clave: '', seguridad: 'WPA' };   // seguridad: WPA, WEP o nopass
const PAGOS = [
  // { metodo: 'Nequi', titular: '', dato: '' },
];
const REDES = {
  instagram: 'https://instagram.com/coloquialcoffee',
  whatsapp: 'https://wa.me/573123164982',
  tiktok: '',
  facebook: '',
  resena: ''   // enlace para dejar reseña en Google
};
const MAPA = 'https://www.google.com/maps/search/?api=1&query=Kr%202A%20%236-90%2C%20Mariquita%2C%20Tolima';
/* ============================================ */

const $=s=>document.querySelector(s);
const ic=id=>`<svg class="ico"><use href="#i-${id}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600);};
let d=0;const delay=()=>`style="animation-delay:${(d++)*70}ms"`;
let html=`<a class="menu up" ${delay()} href="../"><img src="../img/capuchino.jpg" alt=""><span><b>Ver el menú</b><small>Cafés, desayunos, brunch y postres</small></span><span class="go">${ic('arrow')}</span></a>`;
const kv=(label,val)=>`<div class="kv"><div><small>${label}</small><code>${esc(val)}</code></div><button class="copy" data-copy="${esc(val)}">${ic('copy')}Copiar</button></div>`;
if(WIFI.red){
  html+=`<div class="card up" ${delay()}><button class="row" data-toggle aria-expanded="false"><span class="ci">${ic('wifi')}</span><span class="tx"><b>WiFi gratis</b><small>Toca para ver la clave</small></span><span class="chev">${ic('chev')}</span></button>
   <div class="more"><div><div class="in">${kv('Red',WIFI.red)}${WIFI.clave?kv('Clave',WIFI.clave):''}<div class="qr"><canvas id="qr" width="110" height="110"></canvas><span>¿Otro celular en la mesa? Que escanee este código con la cámara y se conecta solo.</span></div></div></div></div></div>`;
}
if(PAGOS.length){
  html+=`<div class="card up" ${delay()}><button class="row" data-toggle aria-expanded="false"><span class="ci">${ic('wallet')}</span><span class="tx"><b>Medios de pago</b><small>${PAGOS.map(p=>esc(p.metodo)).join(' · ')}</small></span><span class="chev">${ic('chev')}</span></button>
   <div class="more"><div><div class="in">${PAGOS.map(p=>kv(esc(p.metodo)+(p.titular?' · '+esc(p.titular):''),p.dato)).join('')}<p class="foot" style="margin:2px 0 0">Envía el comprobante a tu mesero o por WhatsApp.</p></div></div></div></div>`;
}
html+=`<p class="h up" ${delay()}>Síguenos</p><div class="soc up" ${delay()}>`;
const S=[['instagram','Instagram','ig','linear-gradient(45deg,#f9a03f,#d62976,#7c3aed)'],['whatsapp','WhatsApp','wa','#25d366'],['tiktok','TikTok','tt','#111'],['facebook','Facebook','fb','#1877f2'],['resena','Califícanos','star','var(--goldbg)']];
S.forEach(([k,l,i,bg])=>{if(REDES[k])html+=`<a href="${esc(REDES[k])}" target="_blank" rel="noopener"><span class="ci" style="background:${bg}">${ic(i)}</span>${l}</a>`;});
html+=`<a href="${MAPA}" target="_blank" rel="noopener"><span class="ci" style="background:var(--esp);color:var(--gold)">${ic('pin')}</span>Cómo llegar</a></div>`;
$('#wrap').innerHTML=html;

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-toggle]');if(t){const c=t.closest('.card');c.classList.toggle('open');t.setAttribute('aria-expanded',c.classList.contains('open'));return;}
  const b=e.target.closest('[data-copy]');if(b){
    try{await navigator.clipboard.writeText(b.dataset.copy);}catch(err){const i=document.createElement('textarea');i.value=b.dataset.copy;document.body.appendChild(i);i.select();try{document.execCommand('copy');}catch(e2){}i.remove();}
    b.classList.add('ok');b.lastChild.textContent='Copiado';toast('Copiado');setTimeout(()=>{b.classList.remove('ok');b.lastChild.textContent='Copiar';},1800);}
});
if(WIFI.red&&window.qrcode){const s=c=>c.replace(/([\\;,:"])/g,'\\$1');const q=qrcode(0,'M');q.addData(`WIFI:T:${WIFI.clave?WIFI.seguridad:'nopass'};S:${s(WIFI.red)};P:${s(WIFI.clave)};;`);q.make();
  const cv=$('#qr'),x=cv.getContext('2d'),n=q.getModuleCount(),m=110/n;x.fillStyle='#fff';x.fillRect(0,0,110,110);x.fillStyle='#2a1c14';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(Math.floor(c*m),Math.floor(r*m),Math.ceil(m),Math.ceil(m));}
}
</script>
</body>
</html>
